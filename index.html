<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قصص نجاح حقيقية - بالأرقام</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2a4d;--navy2:#122e5a;--red:#e55a5a;--green:#ffb729;--gray:#8a99b1;--light:#f8fafc;}
body{font-family:'Tajawal',sans-serif;background:#fff;color:var(--navy);overflow-x:hidden;}
.section{max-width:1350px;margin:0 auto;padding:72px 20px;position:relative;}
.title{font-weight:800;font-size:clamp(28px,3.5vw,40px);color:var(--navy);line-height:1.25;text-align:right !important;}
.sub{color:var(--gray);font-size:clamp(14px,1.5vw,16px);margin-top:10px;text-align:right !important;width:100%;}
.badge-story{border:1px solid #e6eaf0;border-radius:999px;padding:10px 18px;background:#fff;display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--navy);box-shadow:0 2px 10px rgba(15,42,77,.05);}
.viewport{overflow:hidden;position:relative;padding-bottom:20px;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;}
.viewport.dragging{cursor:grabbing;}
.viewport.dragging .card-story{pointer-events:none;}
.track{display:flex;gap:22px;transition:transform.7s cubic-bezier(.22,1,.36,1);will-change:transform;}
.track.dragging{transition:none !important;}
.card-story{background:#fff;border:1px solid #eef2f7;border-radius:22px;padding:24px 22px 20px;box-shadow:0 10px 30px rgba(15,42,77,.05);flex-shrink:0;min-height:340px;display:flex;flex-direction:column;position:relative;overflow:hidden;transition:all.35s ease;}
.card-story::before{content:'';position:absolute;top:0;right:0;width:100%;height:4px;background:linear-gradient(90deg,var(--green),var(--navy2));opacity:0;transition:.35s;}
.card-story:hover::before{opacity:1;}
.card-story.active{border-color:var(--navy2);box-shadow:0 16px 40px rgba(18,46,90,.12);}
.play{width:42px;height:42px;border-radius:50%;background:var(--navy2);border:none;display:flex;align-items:center;justify-content:center;transition:.2s;box-shadow:0 4px 12px rgba(18,46,90,.18);}
.play:hover{background:var(--green);transform:scale(1.08);}
.avatar{width:52px;height:52px;border-radius:50%;border:2px solid #f1f4f8;object-fit:cover;background:#eef2f7;}
.name{font-weight:800;font-size:15.5px;}
.meta{font-size:12.5px;color:var(--gray);margin-top:3px;}
.score{background:var(--light);border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin:20px 0 18px;position:relative;}
.score .before{color:var(--red);font-weight:800;font-size:24px;}
.score .after{color:var(--navy);font-weight:800;font-size:28px;}
.score .lbl{font-size:12px;color:#9aa9bf;font-weight:500;}
.line{flex:1;height:3px;background:#e6eaf0;margin:0 14px;border-radius:10px;position:relative;}
.dotA{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:32px;height:32px;background:var(--green);border-radius:50%;border:3px solid var(--light);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(26,188,156,.35);animation:pulse 2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ffb729}70%{box-shadow:0 0 0 10px rgba(26,188,156,0)}100%{box-shadow:0 0 0 0 rgba(26,188,156,0)}}
.quote{font-size:14.5px;color:#5a6b82;line-height:1.75;flex-grow:1;min-height:70px;}
.nav-btn{width:48px;height:48px;border-radius:50%;background:var(--navy2);border:none;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(18,46,90,.18);transition:.25s;}
.nav-btn:hover{background:var(--navy);transform:translateY(-2px);}
.nav-btn:active{transform:scale(.96);}
.dot{width:10px;height:10px;border-radius:50%;background:#d7deea;border:none;transition:all.35s cubic-bezier(.22,1,.36,1);}
.dot.active{width:32px;background:var(--navy2);border-radius:8px;}
.stars{display:flex;gap:5px;color:#f5b400;font-size:19px;margin-top:8px;}
.stars span{display:inline-block;opacity:0;transform:translateY(14px) scale(0.5) rotate(-15deg);filter:blur(6px);}
.card-story.active .stars span{animation: starEnter 0.75s cubic-bezier(.22,1,.36,1) forwards, starLoop 2.2s ease-in-out infinite;}
.card-story.active .stars span:nth-child(1){animation-delay:0.05s, 0.8s}
.card-story.active .stars span:nth-child(2){animation-delay:0.15s, 0.95s}
.card-story.active .stars span:nth-child(3){animation-delay:0.25s, 1.1s}
.card-story.active .stars span:nth-child(4){animation-delay:0.35s, 1.25s}
.card-story.active .stars span:nth-child(5){animation-delay:0.45s, 1.4s}
@keyframes starEnter{0%{ opacity:0; transform:translateY(14px) scale(0.5) rotate(-15deg); filter:blur(6px); }60%{ opacity:1; transform:translateY(-5px) scale(1.3) rotate(10deg); filter:blur(0); }100%{ opacity:1; transform:translateY(0) scale(1) rotate(0deg); filter:blur(0); }}
@keyframes starLoop{0%,100%{ transform:translateY(0) scale(1) rotate(0deg); }25%{ transform:translateY(-3px) scale(1.12) rotate(5deg); }50%{ transform:translateY(0) scale(1) rotate(0deg); }75%{ transform:translateY(-2px) scale(1.12) rotate(-5deg); }}
.star-burst{position:fixed;pointer-events:none;z-index:9999;font-size:18px;color:#f5b400;animation:burst 1.2s cubic-bezier(.22,1,.36,1) forwards;}
@keyframes burst{0%{transform:translate(0,0) scale(0) rotate(0deg);opacity:1;}100%{transform:translate(var(--tx),var(--ty)) scale(1.4) rotate(360deg);opacity:0;}}
.confetti{position:fixed;pointer-events:none;z-index:9998;width:8px;height:8px;border-radius:50%;animation:confetti 1s ease-out forwards;}
@keyframes confetti{0%{transform:translate(0,0) scale(1);opacity:1;}100%{transform:translate(var(--tx),var(--ty)) rotate(720deg) scale(0);opacity:0;}}
.progress-line{height:3px;background:#eef2f7;border-radius:10px;overflow:hidden;margin-top:24px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--navy2),var(--green));width:0%;}
.quote.typewriter::after{content:'|';display:inline-block;margin-right:4px;color:var(--navy2);font-weight:800;animation:blinkCursor.75s step-end infinite;}
.quote.typewriter.done::after{display:none;}
@keyframes blinkCursor{0%,50%{opacity:1}51%,100%{opacity:0}}
.count-num{display:inline-block;min-width:30px;}
</style>
</head>
<body>
<hr style="width:75%; margin:20px auto; border:0; border-top:1px dashed #ccc;">
<section class="section" style="padding-top:70px">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-end gap-4 mb-5">
    <div class="order-2 order-md-1 text-end">
      <h1 class="title">قصص نجاح حقيقية - بالأرقام</h1>
      <p class="sub mb-0">طلاب بدأوا من 50 و 60 واليوم في الجامعات اللي يحلمون فيها</p>
    </div>
    <div class="order-1 order-md-2">
      <span class="badge-story">
        <span style="width:24px;height:24px;border-radius:50%;background:var(--navy2);display:inline-flex;align-items:center;justify-content:center">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M8 5.14v14l11-7-11-7z"/></svg>
        </span>
        120+ قصة مصورة
      </span>
    </div>
  </div>
  <div id="vp" class="viewport"><div id="track" class="track"></div></div>
  <div class="progress-line"><div id="progressFill" class="progress-fill"></div></div>
  <div class="d-flex justify-content-between align-items-center mt-4 flex-wrap gap-3">
      <div class="d-flex gap-2">
        <button type="button" id="prev" class="nav-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
        <button type="button" id="next" class="nav-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
      </div>
    <div id="dots" class="d-flex gap-2 align-items-center"></div>
    <div style="font-size:12px;color:#9aa9bf;" id="counter">1 / 4</div>
  </div>
</section>

<script>
const testimonials = [
  {id:1,name:"عبدالرحمن المطيري",type:"ستيب",year:"2024",before:60,after:97,quote:"كنت أعيد ستيب للمرة الثالثة مع قياس بلس جبت 97 في شهرين بس. المحاكي حرفيًا نفس الاختبار!",avatar:"saudi_avatar_pixar.webp"},
  {id:2,name:"نورة السبيعي",type:"قدرات",year:"2024",before:65,after:94,quote:"القدرات كان عقدة حياتي، شرح الأستاذة سارة غير كل شيء. الخطة الذكية خلتني أذاكر بذكاء مو بجهد.",avatar:"saudi_woman_avatar.webp"},
  {id:3,name:"فيصل الدوسري",type:"تحصيلي",year:"2024",before:70,after:91,quote:"التحصيلي يحتاج تركيز ملخصات قياس بلس وفرت علي 3 شهور مذاكرة، جبت 91 ودخلت الطب!",avatar:"saudi_avatar_pixar.webp"},
  {id:4,name:"تركي العتيبي",type:"قدرات",year:"2024",before:58,after:92,quote:"من 58 إلى 92 في شهر ونص! بنك الأسئلة هو السر، نفس أفكار الاختبار بالضبط.",avatar:"saudi_avatar_pixar.webp"},
  {id:5,name:"سارة القحطاني",type:"تحصيلي",year:"2024",before:62,after:95,quote:"ملخصات قياس بلس شاملة كل شيء، ما احتجت أي مصدر ثاني وجبت 95.",avatar:"saudi_woman_avatar.webp"},
  {id:6,name:"عبدالله الشهراني",type:"ستيب",year:"2024",before:55,after:96,quote:"المحاكي نفس اختبار ستيب بالضبط، دخلت وأنا مطمئن وجبت 96.",avatar:"saudi_avatar_pixar.webp"},
  {id:7,name:"ريم العبدالله",type:"قدرات",year:"2024",before:60,after:93,quote:"كنت خايفة من الكمي بس مع الشرح المبسط قدرت أجيب 93.",avatar:"saudi_woman_avatar.webp"},
  {id:8,name:"محمد الحربي",type:"تحصيلي",year:"2024",before:68,after:96,quote:"أفضل استثمار هو قياس بلس، وفر وقتي وضاعف درجتي.",avatar:"saudi_avatar_pixar.webp"},
  {id:9,name:"لولوة الدوسري",type:"ستيب",year:"2024",before:62,after:98,quote:"98 في ستيب! ما توقعت بيوم إني أجيبها، شكراً قياس بلس.",avatar:"saudi_woman_avatar.webp"}
];

const track=document.getElementById('track');
const dotsBox=document.getElementById('dots');
const counter=document.getElementById('counter');
const progressFill=document.getElementById('progressFill');
const vp=document.getElementById('vp');

let cur=0, autoTimer=null, _typingTimers=[];
let isDragging=false, hasDragged=false, startX=0, currentX=0;

function perView(){ const w=window.innerWidth; if(w>=1200) return 3; if(w>=768) return 2; return 1; }
function getPages(pv){ return Math.ceil(testimonials.length/pv); }
function getBaseX(){ const pv=perView(); const gap=22; const cw=(vp.clientWidth - gap*(pv-1))/pv; return cur*(cw+gap)*pv; }

function snapToCurrent(){
  const base=getBaseX();
  track.style.transition='transform .35s cubic-bezier(.22,1,.36,1)';
  track.style.transform=`translateX(${base}px)`;
  track.addEventListener('transitionend',()=>{ track.style.transition=''; },{once:true});
}

function cardHTML(it,idx){
 return `<div class="card-story" data-idx="${idx}">
  <div class="d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-3">
      <img src="${it.avatar}" class="avatar" loading="lazy" onerror="this.src='https://i.pravatar.cc/100?img=${idx+1}'">
      <div style="text-align:right"><div class="name">${it.name}</div><div class="meta">${it.type} - ${it.year}</div></div>
    </div>
    <button type="button" class="play"><svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M8 5.14v14l11-7-11-7z"/></svg></button>
  </div>
   <div class="score">
    <div class="text-center" style="width:68px"><div class="lbl">قبل</div><div class="before count-num" data-target="${it.before}">0</div></div>
    <div style="flex:1;display:flex;align-items:center;padding:0 10px"><div class="line"><span class="dotA"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></span></div></div>
    <div class="text-center" style="width:68px"><div class="lbl">بعد</div><div class="after count-num" data-target="${it.after}">0</div></div>
  </div>
  <p class="quote typewriter" data-idx="${idx}"></p>
  <div class="stars"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div>
 </div>`;
}

function init(){
  track.innerHTML=testimonials.map((it,i)=>cardHTML(it,i)).join('');
  buildDots(perView());
  update(false, true);
}
function buildDots(pv){
  const pages=getPages(pv);
  dotsBox.innerHTML=Array.from({length:pages}).map((_,i)=>`<button type="button" class="dot ${i===cur?'active':''}" data-i="${i}"></button>`).join('');
  dotsBox.querySelectorAll('.dot').forEach(b=>b.addEventListener('click',()=>goTo(+b.dataset.i, true, true)));
}
function animateCount(el,target){
  const duration=1400, start=performance.now();
  function step(now){
    const p=Math.min((now-start)/duration,1);
    const ease=1-Math.pow(1-p,3);
    el.textContent=Math.floor(ease*target);
    if(p<1) requestAnimationFrame(step); else el.textContent=target;
  }
  requestAnimationFrame(step);
}
function animateVisibleCards(){
  _typingTimers.forEach(t=>clearTimeout(t)); _typingTimers=[];
  document.querySelectorAll('.card-story.active').forEach(card=>{
    card.querySelectorAll('.count-num').forEach(el=>{
      const target=parseInt(el.dataset.target,10); el.textContent='0'; animateCount(el,target);
    });
    const quoteEl=card.querySelector('.quote.typewriter'); if(!quoteEl) return;
    const idx=parseInt(quoteEl.dataset.idx,10);
    const fullText=`"${testimonials[idx].quote}"`;
    quoteEl.textContent=''; quoteEl.classList.remove('done'); let i=0;
    function typeChar(){
      if(i<=fullText.length){ quoteEl.textContent=fullText.substring(0,i); i++; _typingTimers.push(setTimeout(typeChar,18+Math.random()*32)); }
      else{ quoteEl.classList.add('done'); }
    }
    _typingTimers.push(setTimeout(typeChar,250));
  });
}
function update(withBurst=true, withAnim=true){
  const pv=perView(); let pages=getPages(pv);
  if(cur>=pages) cur=pages-1; if(cur<0) cur=0;
  const gap=22; const cw=(vp.clientWidth - gap*(pv-1))/pv;
  document.querySelectorAll('.card-story').forEach((c,i)=>{
    c.style.width=cw+'px'; const isActive = i>=cur*pv && i<(cur+1)*pv; c.classList.toggle('active',isActive);
  });
  const x=cur*(cw+gap)*pv;
  track.style.transform=`translateX(${x}px)`;
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
  counter.textContent=`${cur+1} / ${pages}`;
  if(withAnim){ restartProgress(); animateVisibleCards(); }
}
function triggerStarBurst(){
  const rect=vp.getBoundingClientRect(); const centerX=rect.left+rect.width/2; const centerY=rect.top+rect.height/2;
  const colors=['#f5b400','#1abc9c','#122e5a','#e55a5a','#fff'];
  for(let i=0;i<18;i++){
    const star=document.createElement('div'); star.className='star-burst'; star.textContent=['★','✦','✧','⭐'][Math.floor(Math.random()*4)];
    star.style.left=centerX+'px'; star.style.top=centerY+'px';
    const angle=Math.random()*Math.PI*2, dist=80+Math.random()*220;
    star.style.setProperty('--tx', Math.cos(angle)*dist+'px'); star.style.setProperty('--ty', Math.sin(angle)*dist+'px');
    star.style.fontSize=(12+Math.random()*22)+'px'; document.body.appendChild(star); setTimeout(()=>star.remove(),1300);
  }
  for(let i=0;i<12;i++){
    const c=document.createElement('div'); c.className='confetti'; c.style.left=centerX+'px'; c.style.top=centerY+'px';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    const angle=Math.random()*Math.PI*2, dist=60+Math.random()*300;
    c.style.setProperty('--tx', Math.cos(angle)*dist+'px'); c.style.setProperty('--ty', Math.sin(angle)*dist+'px');
    document.body.appendChild(c); setTimeout(()=>c.remove(),1100);
  }
}
function goTo(i, withBurst=true, withAnim=true){
  const pv=perView(); const pages=getPages(pv);
  const next=Math.max(0,Math.min(i,pages-1));
  if(next!==cur && withBurst) triggerStarBurst();
  cur=next; if(dotsBox.children.length!==pages) buildDots(pv);
  update(withBurst, withAnim);
}
function restartProgress(){
  progressFill.style.transition='none'; progressFill.style.width='0%';
  void progressFill.offsetWidth;
  requestAnimationFrame(()=>{
    progressFill.style.transition='width 60s linear';
    progressFill.style.width='100%';
  });
}
function startAuto(resetProgress=true){
  stopAuto();
  if(resetProgress) restartProgress();
  autoTimer=setInterval(()=>{
    const pages=getPages(perView());
    goTo((cur+1)%pages, true, true);
  },60000);
}
function stopAuto(){ if(autoTimer){ clearInterval(autoTimer); autoTimer=null; } }

document.getElementById('next').onclick=()=>goTo(cur+1, true, true);
document.getElementById('prev').onclick=()=>goTo(cur-1, true, true);
vp.addEventListener('mouseenter',()=>{ stopAuto(); });
vp.addEventListener('mouseleave',()=>{ startAuto(true); });

// ===== FIXED DRAG LOGIC =====
vp.addEventListener('pointerdown',(e)=>{
  isDragging=true; hasDragged=false; startX=e.clientX; currentX=e.clientX;
  vp.classList.add('dragging'); track.classList.add('dragging');
  track.style.transition='none';
  vp.setPointerCapture(e.pointerId);
  // لا توقف الاوتو هنا - استنى شوف هل هي سحبة ولا كليك
});
vp.addEventListener('dragstart',(e)=>e.preventDefault());
window.addEventListener('pointermove',(e)=>{
  if(!isDragging) return;
  currentX=e.clientX;
  const diff = Math.abs(currentX - startX);
  if(diff > 6 && !hasDragged){
    hasDragged=true;
    stopAuto(); // اول ما يبدأ سحب فعلا وقف الاوتو
  }
  if(!hasDragged) return; // لو لسه كليك متسحبش التراك
  const base=getBaseX(); let newX = base + (currentX - startX);
  const pv=perView(); const gap=22; const cw=(vp.clientWidth - gap*(pv-1))/pv;
  const pages=getPages(pv); const maxX=(pages-1)*(cw+gap)*pv;
  newX=Math.max(0,Math.min(newX,maxX));
  track.style.transform=`translateX(${newX}px)`;
},{passive:false});

function endDrag(e){
  if(!isDragging) return;
  isDragging=false;
  vp.classList.remove('dragging'); track.classList.remove('dragging');
  track.style.transition='';

  if(!hasDragged){
    // دي كانت مجرد كليك - رجع كل حاجة ومتلمسش الاوتو
    snapToCurrent();
    return;
  }

  const diff=startX - currentX;
  if(Math.abs(diff)>80){
    if(diff<0) goTo(cur+1, true, true);
    else goTo(cur-1, true, true);
  }else{
    snapToCurrent();
    startAuto(true);
  }
}
window.addEventListener('pointerup',endDrag);
window.addEventListener('pointercancel',endDrag);

let resizeTimer;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{ buildDots(perView()); goTo(cur,false,false); startAuto(true); },150);
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) stopAuto(); else startAuto(true); });

init();
startAuto(true);
</script>
</body>
</html>
