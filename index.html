<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">

<title>قصص نجاح حقيقية - بالأرقام</title>

<style>
.viewport.dragging { cursor: grabbing !important; }
.viewport.dragging .card-story { pointer-events: none; }
.track.dragging { transition: none !important; }
.card-story::before { content: ''; position: absolute; top: 0; right: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--green), var(--navy2)); opacity: 0; transition: .35s; }
.card-story:hover::before { opacity: 1; }
.card-story.active { border-color: var(--navy2) !important; box-shadow: 0 16px 40px rgba(18,46,90,.12) !important; }
.play:hover { background: var(--green) !important; transform: scale(1.08); }
.nav-btn:hover { background: var(--navy) !important; transform: translateY(-2px); }
.nav-btn:active { transform: scale(.96); }
.dot.active { width: 32px !important; background: var(--navy2) !important; border-radius: 8px !important; }
.stars span { display: inline-block; opacity: 0; transform: translateY(14px) scale(0.5) rotate(-15deg); filter: blur(6px); }
.card-story.active .stars span { animation: starEnter 0.75s cubic-bezier(.22,1,.36,1) forwards, starLoop 2.2s ease-in-out infinite; }
.card-story.active .stars span:nth-child(1) { animation-delay: 0.05s, 0.8s }
.card-story.active .stars span:nth-child(2) { animation-delay: 0.15s, 0.95s }
.card-story.active .stars span:nth-child(3) { animation-delay: 0.25s, 1.1s }
.card-story.active .stars span:nth-child(4) { animation-delay: 0.35s, 1.25s }
.card-story.active .stars span:nth-child(5) { animation-delay: 0.45s, 1.4s }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 #ffb729 } 70% { box-shadow: 0 0 0 10px rgba(26,188,156,0) } 100% { box-shadow: 0 0 rgba(26,188,156,0) } }
@keyframes starEnter { 0% { opacity: 0; transform: translateY(14px) scale(0.5) rotate(-15deg); filter: blur(6px); } 60% { opacity: 1; transform: translateY(-5px) scale(1.3) rotate(10deg); filter: blur(0); } 100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); filter: blur(0); } }
@keyframes starLoop { 0%,100% { transform: translateY(0) scale(1) rotate(0deg); } 25% { transform: translateY(-3px) scale(1.12) rotate(5deg); } 50% { transform: translateY(0) scale(1) rotate(0deg); } 75% { transform: translateY(-2px) scale(1.12) rotate(-5deg); } }
.star-burst { position: fixed; pointer-events: none; z-index: 9999; font-size: 18px; color: #f5b400; animation: burst 1.2s cubic-bezier(.22,1,.36,1) forwards; }
@keyframes burst { 0% { transform: translate(0,0) scale(0) rotate(0deg); opacity: 1; } 100% { transform: translate(var(--tx),var(--ty)) scale(1.4) rotate(360deg); opacity: 0; } }
.confetti { position: fixed; pointer-events: none; z-index: 9998; width: 8px; height: 8px; border-radius: 50%; animation: confetti 1s ease-out forwards; }
@keyframes confetti { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx),var(--ty)) rotate(720deg) scale(0); opacity: 0; } }
.quote.typewriter::after { content: '|'; display: inline-block; margin-right: 4px; color: var(--navy2); font-weight: 800; animation: blinkCursor .75s step-end infinite; }
.quote.typewriter.done::after { display: none; }
@keyframes blinkCursor { 0%,50% { opacity: 1 } 51%,100% { opacity: 0 } }
.count-num { display: inline-block; min-width: 30px; }
</style>
</head>

<script>
const testimonials = [

  {id:3,name:"نورة *******",type:"ستيب",year:"2026",before:0,after:79,quote:"المستشار أو المساعد الشخصي ما كان يقصر في أي شي ويوميًا أرسل له النتائج والتطورات و يعلمني كيف أقدر أتحسن وإيش أحتاج وإذا احتجت شرح يشرح. شكرًا بحجم السماءمحتويات الدورة ولا غلطة ماشاءالله تستاهل كل ريال اندفع فيها، شريت راحة بالك حرفيًا وضمنت الدرجة بعد توفيق الله.",avatar:"saudi_woman_avatar.webp"},
  {id:4,name:"عب**********",type:"قدرات جامعيين",year:"2026",before:57,after:75,quote:" الدرجة اللي قبلها كانت 57 اللي اختبرتها في شهر مايوبفضل الله ثم دورتكم اللي فيها افضل المدربين سواء الكمي او اللفظي جبت 75  أتوقع لو أعطيت نفسي وقت افضل كان جبت اكتر لانه خلصلنا الكمي الاحد وأنا اختبرت الاثنين للاسف وقتي كان ضيق",avatar:"saudi_avatar_pixar.webp"},
  {id:5,name:"تركي *******",type:"التحصيلي",year:"2026",before:63,after:82,quote:"لقد حصلت في الاختبار التحصيلي الفترة الاولى على 63.00 درجة، والفترة الثانية على 82.00 درجة. مع تمنياتنا لك.",avatar:"saudi_avatar_pixar.webp"},
  {id:6,name:"سارة *******",type:"تحصيلي",year:"2026",before:73,after:75,quote:"حابه أشكركم على جهودكم في دورة ستيب  اشتركت في دورة ستيب الأساسية سبتمبر  اختبرت بعد الدورة 3 مرات كان هدفي 75+ المرتين الأولى جبت نفس الدرجة  73  المرة الثالثة جبت درجة أعلى بكثير من الهدف ولله الحمد .",avatar:"saudi_woman_avatar.webp"},

  {id:8,name:"ريم *********",type:"ستيب",year:"2026",before:0,after:0,quote:"شكرًا لكم استاذ عايد والله ع اني ماشفت الملفات كثير ولكن شكرًا من القلب ع شغلكم وتعبكم معانا وغير كذا يكفي اني اخذت الستيب معاك وقفلت بالدرجة اللي ابيها ويوم سمعت ان عندك دورة CPP اشتركت بدون تفكير شكرًا لك وجزاك الله خير ❤.",avatar:"saudi_woman_avatar.webp"},

  {id:10,name:"لولوة *******",type:"الايلتس",year:"2026",before:0,after:0,quote:"الشرح كان واضح جدًا المصادر رائعة و غنيه و د.محمد و أ.منى وأ.سولاف و أ.رقية رائعين و معطائين جدًا ..جزاهم الله خيرا",avatar:"saudi_woman_avatar.webp"},
  {id:11,name:"هند *******",type:"ستيب",year:"2026",before:0,after:0,quote:"عليكم السلام ورحمة الله وبركاته .. التجربة رائعة والاستاذ وائل ممتاز في شرحه والإضافة وابل المن من المعلومات ما كنت أتوقعها ان شاء الله تعالى تظهر انعكاسها بالامتحان القادم",avatar:"saudi_woman_avatar.webp"}
];

const track = document.getElementById('track');
const dotsBox = document.getElementById('dots');
const counter = document.getElementById('counter');
const progressFill = document.getElementById('progressFill');
const vp = document.getElementById('vp');

let cur = 0, _typingTimers = [];
let isDragging = false, hasDragged = false, startX = 0, currentX = 0;

// === نظام الـ progress الجديد (يوقف ويكمل من نفس النقطة) ===
const AUTO_DURATION = 60000;
let progressElapsed = 0;
let progressStart = 0;
let autoTimeout = null;
let isRunning = false;

function clearAutoTimeout(){ if(autoTimeout){ clearTimeout(autoTimeout); autoTimeout=null; } }

function resetProgressAndStart(){
  clearAutoTimeout();
  progressElapsed = 0;
  progressStart = performance.now();
  isRunning = true;
  progressFill.style.transition = 'none';
  progressFill.style.width = '0%';
  void progressFill.offsetWidth;
  requestAnimationFrame(()=>{
    progressFill.style.transition = `width ${AUTO_DURATION}ms linear`;
    progressFill.style.width = '100%';
  });
  autoTimeout = setTimeout(()=>{
    const pages = getPages(perView());
    goTo((cur+1)%pages, true, true);
  }, AUTO_DURATION);
}

function pauseProgress(){
  if(!isRunning) return;
  progressElapsed += performance.now() - progressStart;
  isRunning = false;
  const pct = Math.min((progressElapsed / AUTO_DURATION) * 100, 100);
  progressFill.style.transition = 'none';
  progressFill.style.width = pct + '%';
  clearAutoTimeout();
}

function resumeProgress(){
  if(isRunning) return;
  if(progressElapsed >= AUTO_DURATION) progressElapsed = 0;
  progressStart = performance.now();
  isRunning = true;
  const remaining = AUTO_DURATION - progressElapsed;
  void progressFill.offsetWidth;
  requestAnimationFrame(()=>{
    progressFill.style.transition = `width ${remaining}ms linear`;
    progressFill.style.width = '100%';
  });
  autoTimeout = setTimeout(()=>{
    const pages = getPages(perView());
    goTo((cur+1)%pages, true, true);
  }, remaining);
}

// دوال توافقية مع الكود القديم
function restartProgress(){ resetProgressAndStart(); }
function startAuto(reset = true){ if(reset) resetProgressAndStart(); else resumeProgress(); }
function stopAuto(){ pauseProgress(); }

function perView() { const w=window.innerWidth; if(w>=1200) return 3; if(w>=768) return 2; return 1; }
function getPages(pv) { return Math.ceil(testimonials.length/pv); }
function getBaseX() { const pv=perView(); const gap=22; const cw=(vp.clientWidth - gap*(pv-1))/pv; return cur*(cw+gap)*pv; }

function snapToCurrent() {
  const base = getBaseX();
  track.style.transition = 'transform .35s cubic-bezier(.22,1,.36,1)';
  track.style.transform = `translateX(${base}px)`;
  track.addEventListener('transitionend', () => { track.style.transition = ''; }, {once: true});
}

function cardHTML(it, idx) {
 const beforeEmpty = !it.before || it.before === 0;
 const afterEmpty = !it.after || it.after === 0;
 return `<div class="card-story" data-idx="${idx}" style="background:#fff; border:1px solid #eef2f7; border-radius:22px; padding:24px 22px 20px; box-shadow:0 10px 30px rgba(15,42,77,.05); flex-shrink:0; min-height:340px; display:flex; flex-direction:column; position:relative; overflow:hidden; transition:all .35s ease;">
  <div class="d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-3">
      <img src="${it.avatar}" style="width:52px; height:52px; border-radius:50%; border:2px solid #f1f4f8; object-fit:cover; background:#eef2f7;" loading="lazy" onerror="this.src='https://i.pravatar.cc/100?img=${idx+1}'">
      <div style="text-align:right">
        <div style="font-weight:800; font-size:15.5px;">${it.name}</div>
        <div style="font-size:12.5px; color:var(--gray); margin-top:3px;">${it.type} - ${it.year}</div>
      </div>
    </div>
    <button type="button" class="play" style="width:42px; height:42px; border-radius:50%; background:var(--navy2); border:none; display:flex; align-items:center; justify-content:center; transition:.2s; box-shadow:0 4px 12px rgba(18,46,90,.18);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M8 5.14v14l11-7-11-7z"/></svg>
    </button>
  </div>
   <div style="background:var(--light); border-radius:14px; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; margin:20px 0 18px; position:relative;">
    <div class="text-center" style="width:68px">
      <div style="font-size:12px; color:#9aa9bf; font-weight:500;">قبل</div>
      <div class="count-num" data-target="${it.before}" style="color:var(--red); font-weight:800; font-size:24px;">${beforeEmpty ? '**' : '0'}</div>
    </div>
    <div style="flex:1; display:flex; align-items:center; padding:0 10px">
      <div style="flex:1; height:3px; background:#e6eaf0; margin:0 14px; border-radius:10px; position:relative;">
        <span style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:32px; height:32px; background:var(--green); border-radius:50%; border:3px solid var(--light); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(26,188,156,.35); animation:pulse 2s infinite;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </span>
      </div>
    </div>
    <div class="text-center" style="width:68px">
      <div style="font-size:12px; color:#9aa9bf; font-weight:500;">بعد</div>
      <div class="count-num" data-target="${it.after}" style="color:var(--navy); font-weight:800; font-size:28px;">${afterEmpty ? '**' : '0'}</div>
    </div>
  </div>
  <p class="quote typewriter" data-idx="${idx}" style="font-size:14.5px; color:#5a6b82; line-height:1.75; flex-grow:1; min-height:70px;"></p>
  <div class="stars" style="display:flex; gap:5px; color:#f5b400; font-size:19px; margin-top:8px;">
    <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
  </div>
 </div>`;
}

function init() {
  track.innerHTML = testimonials.map((it,i) => cardHTML(it,i)).join('');
  buildDots(perView());
  update(false, true);
}
function buildDots(pv) {
  const pages = getPages(pv);
  dotsBox.innerHTML = Array.from({length:pages}).map((_,i) => `<button type="button" class="dot ${i===cur?'active':''}" data-i="${i}" style="width:10px; height:10px; border-radius:50%; background:#d7deea; border:none; transition:all .35s cubic-bezier(.22,1,.36,1); margin:0 4px;"></button>`).join('');
  dotsBox.querySelectorAll('.dot').forEach(b => b.addEventListener('click', () => goTo(+b.dataset.i, true, true)));
}
function animateCount(el, target) {
  if(!target || target === 0 || isNaN(target)){
    el.textContent = '**';
    return;
  }
  const duration = 1400, start = performance.now();
  function step(now) {
    const p = Math.min((now-start)/duration, 1);
    const ease = 1 - Math.pow(1-p, 3);
    el.textContent = Math.floor(ease * target);
    if(p<1) requestAnimationFrame(step); else el.textContent = target;
  }
  requestAnimationFrame(step);
}
function animateVisibleCards() {
  _typingTimers.forEach(t => clearTimeout(t)); _typingTimers = [];
  document.querySelectorAll('.card-story.active').forEach(card => {
    card.querySelectorAll('.count-num').forEach(el => {
      const target = parseInt(el.dataset.target, 10);
      if(!target || isNaN(target) || target===0) {
        el.textContent = '**';
        return;
      }
      el.textContent = '0';
      animateCount(el, target);
    });
    const quoteEl = card.querySelector('.quote.typewriter'); if(!quoteEl) return;
    const idx = parseInt(quoteEl.dataset.idx, 10);
    const fullText = `"${testimonials[idx].quote}"`;
    quoteEl.textContent = ''; quoteEl.classList.remove('done'); let i=0;
    function typeChar() {
      if(i <= fullText.length) { quoteEl.textContent = fullText.substring(0,i); i++; _typingTimers.push(setTimeout(typeChar, 18+Math.random()*32)); }
      else { quoteEl.classList.add('done'); }
    }
    _typingTimers.push(setTimeout(typeChar, 250));
  });
}
function update(withBurst = true, withAnim = true) {
  const pv = perView(); let pages = getPages(pv);
  if(pages>0) { cur = ((cur % pages) + pages) % pages; }
  const gap = 22; const cw = (vp.clientWidth - gap*(pv-1))/pv;
  document.querySelectorAll('.card-story').forEach((c, i) => {
    c.style.width = cw + 'px'; const isActive = i >= cur*pv && i < (cur+1)*pv; c.classList.toggle('active', isActive);
  });
  const x = cur * (cw + gap) * pv;
  track.style.transform = `translateX(${x}px)`;
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === cur));
  counter.textContent = `${cur+1} / ${pages}`;
  if(withAnim) { restartProgress(); animateVisibleCards(); }
}
function triggerStarBurst() {
  const rect = vp.getBoundingClientRect(); const centerX = rect.left + rect.width/2; const centerY = rect.top + rect.height/2;
  const colors = ['#f5b400','#1abc9c','#122e5a','#e55a5a','#fff'];
  for(let i=0; i<18; i++) {
    const star = document.createElement('div'); star.className = 'star-burst'; star.textContent = ['★','✦','✧','⭐'][Math.floor(Math.random()*4)];
    star.style.left = centerX + 'px'; star.style.top = centerY + 'px';
    const angle = Math.random() * Math.PI*2, dist = 80 + Math.random()*220;
    star.style.setProperty('--tx', Math.cos(angle)*dist + 'px'); star.style.setProperty('--ty', Math.sin(angle)*dist + 'px');
    star.style.fontSize = (12 + Math.random()*22) + 'px'; document.body.appendChild(star); setTimeout(() => star.remove(), 1300);
  }
  for(let i=0; i<12; i++) {
    const c = document.createElement('div'); c.className = 'confetti'; c.style.left = centerX + 'px'; c.style.top = centerY + 'px';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    const angle = Math.random() * Math.PI*2, dist = 60 + Math.random()*300;
    c.style.setProperty('--tx', Math.cos(angle)*dist + 'px'); c.style.setProperty('--ty', Math.sin(angle)*dist + 'px');
    document.body.appendChild(c); setTimeout(() => c.remove(), 1100);
  }
}
function goTo(i, withBurst = true, withAnim = true) {
  const pv = perView(); const pages = getPages(pv);
  const next = ((i % pages) + pages) % pages; 
  if(next !== cur && withBurst) triggerStarBurst();
  cur = next; if(dotsBox.children.length !== pages) buildDots(pv);
  update(withBurst, withAnim);
}

document.getElementById('next').onclick = () => goTo(cur+1, true, true);
document.getElementById('prev').onclick = () => goTo(cur-1, true, true);

// التعديل الأساسي هنا: يوقف ويكمل من نفس النقطة
vp.addEventListener('mouseenter', pauseProgress);
vp.addEventListener('mouseleave', resumeProgress);

vp.addEventListener('pointerdown', (e) => {
  isDragging = true; hasDragged = false; startX = e.clientX; currentX = e.clientX;
  vp.classList.add('dragging'); track.classList.add('dragging');
  track.style.transition = 'none';
  vp.setPointerCapture(e.pointerId);
});
vp.addEventListener('dragstart', (e) => e.preventDefault());
window.addEventListener('pointermove', (e) => {
  if(!isDragging) return;
  currentX = e.clientX;
  const diff = Math.abs(currentX - startX);
  if(diff > 6 && !hasDragged) {
    hasDragged = true;
    pauseProgress();
  }
  if(!hasDragged) return;
  const base = getBaseX(); let newX = base + (currentX - startX);
  const pv = perView(); const gap = 22; const cw = (vp.clientWidth - gap*(pv-1))/pv;
  const pages = getPages(pv); const maxX = (pages-1)*(cw+gap)*pv;
  newX = Math.max(0, Math.min(newX, maxX));
  track.style.transform = `translateX(${newX}px)`;
}, {passive: false});

function endDrag(e) {
  if(!isDragging) return;
  isDragging = false;
  vp.classList.remove('dragging'); track.classList.remove('dragging');
  track.style.transition = '';

  if(!hasDragged) {
    snapToCurrent();
    return;
  }

  const diff = startX - currentX;
  if(Math.abs(diff) > 80) {
    if(diff < 0) goTo(cur+1, true, true);
    else goTo(cur-1, true, true);
  } else {
    snapToCurrent();
    resumeProgress();
  }
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { buildDots(perView()); goTo(cur, false, false); resetProgressAndStart(); }, 150);
});
document.addEventListener('visibilitychange', () => { if(document.hidden) pauseProgress(); else resumeProgress(); });

init();
resetProgressAndStart();
</script>
